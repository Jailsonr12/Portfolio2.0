<div class="card-container">
    <article class="card">
        <div class="card-title" *ngIf="title">
            <h3>{{ title }}</h3>
        </div>
        <img *ngIf="imageUrl" (click)="openModal(imageUrl)" (keydown.enter)="openModal(imageUrl)" tabindex="0"
            role="button" [src]="imageUrl" [alt]="'Imagem do projeto ' + title">
        <div class="card-content">
            <div class="card-sobre" *ngIf="about">
                <p>Sobre</p>
                <h3>{{ about }}</h3>
            </div>
            <div class="card-sobre" *ngIf="technologies">
                <p>Tecnologia</p>
                <h3>{{ technologies }}</h3>
            </div>
        </div>
        <div class="card-footer">
            <a *ngIf="githubLink" [href]="githubLink" target="_blank" rel="noopener">GitHub</a>
            <a *ngIf="pageLink" [href]="pageLink" target="_blank" rel="noopener">Ver projeto</a>
            <span class="privado" *ngIf="!githubLink && !pageLink">Repositório privado</span>
        </div>
    </article>
</div>
<app-modal-img *ngIf="showFullscreen" [fullimag]="true" [fullscreenImageUrl]="fullscreenImageUrl" (closeModal)="closeModal()"></app-modal-img>
