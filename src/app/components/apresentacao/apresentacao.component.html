<section class="projetos" id="projetos">
    <header>
        <div class="title">
            <h1>Projetos</h1>
        </div>
    </header>
    <main>
        <ul>
            <li *ngFor="let projeto of projetos; let i = index" appRevelar [atraso]="(i % 3) * 90">
                <app-projeto-direita [projeto]="projeto"></app-projeto-direita>
            </li>
        </ul>
    </main>
</section>
